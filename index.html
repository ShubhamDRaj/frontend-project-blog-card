<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
    <title>Shubham - Blog card</title>
</head>
<body>
  <main>
    <article class="card grid-flow">
        <div class="img-cover"><img class="card-img" src="assets/images/illustration-article.svg" alt="illustration picture with yellow and black colour containing HTML closing tag for the blog post titled HTML & CSS Foundations"></div>

        <div class="card-content">
            <p class="card-topic text-bold">Learning</p>
            <p class="card-published-date">Published 21 Dec 2023</p>
            <h1 class="card-title"><a href="#">HTML & CSS foundations</a></h1>
            <p class="card-description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
        </div>
        
        <div class="flex-flow">
            <img class="author-avatar" src="assets/images/image-avatar.webp" alt="profile picture of the author Greg Hooper">
            <p class="text-bold">Greg Hooper</p>
        </div>
    </article>
  </main>
</body>
</html>
